<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — MindPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-aside">
    <a href="login.html" class="brand">MindPulse</a>
    <div>
      <h2>See how your daily habits shape your wellbeing.</h2>
     
    </div>
    <small>Informational only, not a clinical assessment.</small>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="lead">Log in to continue.</p>
      <form id="login-form" novalidate>
        <div class="form-alert" id="form-alert" role="alert"></div>
        <div class="field">
          <label for="email">Email</label>
          <input type="text" id="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Your password" />
        </div>
        <button type="submit" class="submit-btn" id="submit-btn"><span class="btn-label">Log in</span><span class="btn-spinner" aria-hidden="true"></span></button>
      </form>
      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
</div>
<script src="auth.js"></script>
<script>
  redirectIfLoggedIn();
  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("form-alert");
  const btn = document.getElementById("submit-btn");
  function showAlert(msg) { alertBox.textContent = msg; alertBox.classList.add("show"); }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return showAlert("Enter your email and password.");
    btn.disabled = true; btn.classList.add("loading");
    try {
      const res = await fetch(API_BASE + "/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return showAlert(typeof body.detail === "string" ? body.detail : "Login failed. Check your details.");
      Auth.save(body);
      window.location.replace("index.html");
    } catch (_) {
      showAlert("Can't reach the server at " + API_BASE + ". If it's on Render free tier, wait 30-60s and retry.");
    } finally { btn.disabled = false; btn.classList.remove("loading"); }
  });
</script>
</body>
</html>
